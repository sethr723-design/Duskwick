<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Duskwick">
<meta name="theme-color" content="#0f1226">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<title>Duskwick</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#eef0f8;--fg:#14162b;--en:#7a55e8;--gd:#c9a24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--fg:#ece9ff;--en:#a48cff}}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#0b0a1c;color:var(--fg);font:15px/1.4 system-ui,sans-serif;overflow:hidden;position:fixed;inset:0;height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
:fullscreen #app,body.fs #app{max-width:none}
#fsb{position:absolute;right:12px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:2;padding:6px 9px}body:not(.exp) #fsb{display:none}
#devb{position:absolute;top:34px;left:50%;transform:translateX(-50%);background:#5a1a6a;border:1px solid #d08aff;color:#f0d8ff;font:800 10px system-ui;letter-spacing:.14em;padding:1px 8px;border-radius:8px;pointer-events:none;z-index:2;display:none}
body.dev #devb{display:block}#dwin{display:none;background:#5a1a6a;border:1px solid #d08aff}body.dev #dwin{display:block}
#app{height:100%;max-width:1600px;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;touch-action:none;background:linear-gradient(#120c2c,#3a2358 45%,#8a3f6a 72%,#e08a62)}
canvas{display:block;width:100%;height:100%}
button{font:inherit}
.hud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.unit{width:min(290px,44%);display:flex;align-items:center;gap:8px;color:#f0edff;background:linear-gradient(rgba(44,32,18,.92),rgba(20,14,10,.92));border:1px solid var(--gd);box-shadow:0 0 0 2px #1a1208,inset 0 0 14px rgba(255,190,90,.14),0 4px 10px rgba(0,0,0,.4);border-radius:14px 4px 14px 4px;padding:5px 10px 5px 6px;position:relative}
.unit::before,.unit::after{content:'';position:absolute;width:7px;height:7px;background:var(--gd);transform:rotate(45deg);top:50%;margin-top:-4px}
.unit::before{left:-5px}.unit::after{right:-5px}
.unit b,.fu b{font:800 13px Fraunces,Georgia,serif}
.ub{flex:1;min-width:0}
.bar{position:relative;height:12px;border-radius:3px;background:#120c08;border:1px solid #6a5424;overflow:hidden;margin-top:3px}
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.4) 11px 12px)}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#d94a4a,#ff8a6b);transition:width .4s}
#hp{background:linear-gradient(90deg,#2fae6a,#7dff9a)}
.sub{font-size:11px;color:#c9ccf0;min-height:14px}
.lvl{flex:none;width:40px;height:40px;border-radius:50%;background:conic-gradient(#ffd34d var(--xp,0deg),rgba(255,255,255,.16) 0);display:flex;align-items:center;justify-content:center;position:relative}
.lvl::before{content:'';position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a3a64,#1c1430)}
.lvl span{position:relative;font:800 16px Fraunces,Georgia,serif;color:#ffe9b0}
.lvl.ev{background:#d65a4a;width:28px;height:28px}.lvl.ev::before{inset:3px}.lvl.ev span{font-size:12px}
.ttl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#e8c777;min-height:12px}
#eus{display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:auto;width:min(250px,40%)}
.fu{-webkit-appearance:none;appearance:none;width:100%;display:flex;align-items:center;gap:6px;text-align:right;flex-direction:row-reverse;color:#f0edff;background:linear-gradient(rgba(60,22,22,.92),rgba(22,10,10,.92));border:1px solid #b5483a;border-radius:4px 12px 4px 12px;padding:3px 6px;cursor:pointer}
.fu .bar{height:8px}.fu .sub{font-size:10px;min-height:0}
.fu.tg{border-color:#ffd34d;box-shadow:0 0 0 2px #ffd34d,0 0 12px rgba(255,211,77,.5)}
#eus,#bui{transition:transform .45s cubic-bezier(.2,.8,.3,1),opacity .35s}
body.exp #eus{opacity:0;transform:translateX(30px);pointer-events:none}body.exp #bui{transform:translateY(105%);opacity:0;pointer-events:none}
#vign{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(40,6,10,.55) 100%);transition:opacity .6s}
body:not(.exp) #vign{opacity:1}
#qte{position:absolute;width:0;height:0;pointer-events:none;display:none;z-index:30}
#qte .tg,#qte .sh{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
#qte .tg{width:62px;height:62px;border:5px solid #ffd27a;box-shadow:0 0 14px #ffd27a,inset 0 0 10px #ffd27a;background:rgba(255,210,122,.12)}
#qte .sh{border:4px solid #fff;box-shadow:0 0 8px #fff}
#qte .lb{position:absolute;left:0;top:48px;transform:translateX(-50%);white-space:nowrap;font:800 14px Georgia,serif;color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000}
#qte.blk .tg{border-color:#8ad0ff;box-shadow:0 0 14px #8ad0ff,inset 0 0 10px #8ad0ff;background:rgba(138,208,255,.12)}
#qte.res .sh{display:none}#qte.res .lb{font-size:26px;top:-16px;animation:qpop .5s ease-out}
@keyframes qpop{from{transform:translateX(-50%) scale(1.6);opacity:.4}to{transform:translateX(-50%) scale(1)}}
.chest-c{color:#ffd27a}
/* v7: team column, slot badges, minimap, quest tracker, zone card, safe glow */
#lcol{width:min(290px,44%);display:flex;flex-direction:column;gap:5px;pointer-events:none}
#lcol .unit{width:auto}
#aus{display:flex;flex-direction:column;gap:4px;transition:transform .45s cubic-bezier(.2,.8,.3,1),opacity .35s}
body.exp #aus{opacity:0;transform:translateX(-30px)}
.au{display:flex;align-items:center;gap:6px;color:#e8fbff;background:linear-gradient(rgba(14,44,58,.92),rgba(8,20,30,.92));border:1px solid #4ac0e8;border-radius:12px 4px 12px 4px;padding:3px 8px 3px 4px;width:86%;box-sizing:border-box}
.au .bar{height:8px}.au .bar i{background:linear-gradient(90deg,#2fae6a,#7dff9a)}.au b{font:800 12px Fraunces,Georgia,serif}.au .sub{font-size:10px;min-height:0}
.sl{flex:none;width:20px;height:20px;border-radius:50%;font:800 11px/20px system-ui;text-align:center;color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.sl.a{background:radial-gradient(circle at 35% 30%,#8ae8ff,#1a7aa8)}.sl.e{background:radial-gradient(circle at 35% 30%,#ff9a8a,#a8241a)}
.unit .sl{display:none;position:absolute;left:-7px;top:-7px;z-index:1}body:not(.exp) .unit .sl{display:block}
.side{font:800 10px system-ui;letter-spacing:.14em;text-transform:uppercase;padding:1px 7px;border-radius:6px;align-self:flex-start}
.side.a{background:#1a7aa8;color:#e8fbff}.side.e{background:#a8241a;color:#ffe0d8;align-self:flex-end}
#mmw{position:absolute;top:8px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none;z-index:2;transition:opacity .35s}
body:not(.exp) #mmw{opacity:0}
#mmc{width:138px;display:flex;flex-direction:column;align-items:center;gap:4px}
#mm{width:138px;height:138px;border-radius:50%;box-shadow:0 0 0 3px #c9a24a,0 0 0 5px #1a1208,0 4px 12px rgba(0,0,0,.5);background:#1c1530}
#zplate{max-width:180px;text-align:center;font:800 12px Fraunces,Georgia,serif;color:#ffe9b0;background:linear-gradient(rgba(44,32,18,.94),rgba(20,14,10,.94));border:1px solid var(--gd);border-radius:8px;padding:2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zplate.safe{color:#b8ffd8;border-color:#5aff9a;background:linear-gradient(rgba(20,60,40,.95),rgba(10,30,20,.95))}
#zplate.safe::after{content:'  · SAFE';font:700 10px system-ui;letter-spacing:.1em}
#qtrk{width:min(230px,46vw);box-sizing:border-box;background:linear-gradient(rgba(30,22,52,.9),rgba(16,12,30,.9));border:1px solid #8a7ad8;border-radius:10px;padding:5px 9px;color:#ece9ff;font-size:12px;line-height:1.3;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#qtrk b{color:#ffd34d;font:800 13px Fraunces,Georgia,serif;display:block}#qtrk small{color:#b9b3e6;display:block;font-size:11px}#qtrk em{color:#7dff9a;font-style:normal;font-weight:700}
#qtrk:empty{display:none}
#zcard{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:3;opacity:0;color:#ffe9b0;font:800 34px Fraunces,Georgia,serif;text-shadow:0 2px 0 #1a1208,0 0 22px rgba(255,190,90,.6);white-space:nowrap}
#zcard small{display:block;font:700 12px system-ui;letter-spacing:.3em;text-transform:uppercase;color:#c9b8ff;margin-top:2px}
#zcard.sf small{color:#8affb8}
#zcard.go{animation:zc 3s ease-out}
@keyframes zc{0%{opacity:0;letter-spacing:.18em}15%{opacity:1;letter-spacing:.02em}72%{opacity:1}100%{opacity:0}}
body:not(.exp) #zcard{display:none}
#safev{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 70px rgba(90,255,154,.3);opacity:0;transition:opacity .6s}
#safev.on{opacity:1}body:not(.exp) #safev{opacity:0}
.ib{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(#3a2a52,#1c1430)!important;border:1px solid var(--gd)!important;color:#ffe9b0!important;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.ib svg{width:18px;height:18px;flex:none}
/* v8: quest cards, dialogue, dyes, battle action bar + turn timer */
.qc{display:flex;gap:10px;align-items:center;border:1px solid #6a5424;border-radius:10px;padding:8px 10px;margin:6px 0;background:linear-gradient(#2e2216,#1c140c);box-shadow:inset 0 0 12px rgba(255,190,90,.06)}
.qc>div{flex:1;min-width:0}.qc b{font:800 14px Fraunces,Georgia,serif;color:#ffe9b0}.qc small{display:block;color:#c9bfa0;font-size:12px;margin-top:2px}
.qc.imp{border-color:#ffd34d;background:linear-gradient(#3a2a10,#21180a);box-shadow:0 0 0 1px rgba(255,211,77,.3),0 0 14px rgba(255,211,77,.18)}
.qc.trk{outline:2px solid #8a7ad8}.qc.dn{opacity:.6}
.tag{display:inline-block;font:800 9px/1.5 system-ui;letter-spacing:.12em;padding:0 6px;border-radius:6px;background:#ffd34d;color:#2a1a05;vertical-align:2px;margin-right:6px}.tag.s{background:#6a5ac8;color:#fff}
.qp{height:6px;background:#120c08;border:1px solid #4a3a20;border-radius:4px;margin-top:5px;overflow:hidden}.qp i{display:block;height:100%;background:linear-gradient(90deg,#c9a24a,#ffe29a)}
.sec{font:800 11px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#e8c777;margin:12px 0 2px;display:flex;align-items:center;gap:8px}.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#6a5424,transparent)}
.dlg{border:1px solid var(--gd);border-radius:12px;background:linear-gradient(#f3e6c8,#e0cfa4);color:#2a1a0a;padding:12px 14px 10px;margin:4px 0 10px;box-shadow:inset 0 0 18px rgba(90,60,20,.25)}
.dlg .spk{display:inline-block;font:800 14px Fraunces,Georgia,serif;color:#ffe9b0;background:linear-gradient(#5a3a1a,#3a2410);border-radius:8px;padding:2px 10px;margin:-22px 0 6px -4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dlg p{font:16px/1.5 Georgia,serif;margin:2px 0 10px}.dlg .da{display:flex;justify-content:flex-end;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #1a1208;cursor:pointer;box-shadow:0 0 0 1px #c9a24a}.sw.on{box-shadow:0 0 0 3px #ffd34d}
#hrow{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:0 8px}
#hrow #hand{flex:0 1 auto;min-width:0}
#acts{flex-direction:column;align-items:stretch;padding-bottom:4px;flex:none}
#tmr{position:relative;height:20px;border-radius:10px;background:#120c08;border:1px solid #6a5424;overflow:hidden;font:800 11px/20px system-ui;color:#ffe9b0;text-align:center}
#tmr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c9a24a,#ffe29a);opacity:.55;transition:width .25s linear}#tmr span{position:relative}
#panel.talk{background:linear-gradient(transparent 35%,rgba(10,8,28,.6));justify-content:flex-end;padding-bottom:20px}#panel.talk .pbox{max-height:56%}
@media (min-aspect-ratio:1/1){#panel.mirror{background:linear-gradient(90deg,transparent 45%,rgba(10,8,28,.55));justify-content:center;align-items:flex-end;padding:16px 20px}#panel.mirror .pbox{width:min(420px,44%);max-height:94%}}
#tmr.low i{background:linear-gradient(90deg,#c8341a,#ff8a6b)}#tmr.off{display:none}
#bag{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2}body:not(.exp) #bag{display:none}
.gslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.gs,.gi{-webkit-appearance:none;appearance:none;position:relative;border:2px solid #4a3a20;border-radius:9px;background:radial-gradient(circle at 50% 35%,#3a2a18,#120c08);color:#f0edff;cursor:pointer;padding:4px;text-align:center;font:600 11px system-ui}
.gs{display:flex;align-items:center;gap:6px;text-align:left;min-height:46px}.gs img,.gi img{width:36px;height:36px;flex:none;display:block;margin:0 auto}
.gs span{display:block;font-size:10px;color:#b9b3e6;font-weight:400}.gs b{display:block;font-size:11px;line-height:1.15}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;margin:6px 0}
.gi{aspect-ratio:1;padding:2px;display:flex;align-items:center;justify-content:center}.gi.sel,.gs.sel{box-shadow:0 0 0 2px #ffd34d,0 0 12px rgba(255,211,77,.5)}
.gi.em{opacity:.25;cursor:default}.gi small{position:absolute;right:3px;bottom:1px;font:700 9px system-ui;color:#ffe29a}
.gdet{border:1px solid #6a5424;border-radius:10px;padding:8px 10px;background:rgba(0,0,0,.25);margin-top:6px;font-size:12px}
.gdet h4{margin:0 0 2px;font:800 15px Fraunces,Georgia,serif}.gdet .up{color:#7dff9a}.gdet .dn{color:#ff8a7a}.gdet .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gstat{font-size:12px;color:#e8c777;margin:2px 0 6px;line-height:1.5}
#hint{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:13px;color:#e6e0ff;pointer-events:none;text-shadow:0 1px 3px #000}
body:not(.exp) #hint,body:not(.exp) #joy,body:not(.exp) #run,body:not(.exp) #book{display:none}
#joy{position:absolute;left:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(128,128,170,.18);touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--en);opacity:.85;pointer-events:none}
#run{position:absolute;left:156px;bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:2}#run.on{background:#ffd34d;color:#2a1a05}
#bui{position:absolute;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(transparent,rgba(8,6,24,.85) 30%);padding-top:18px}
#log{position:absolute;top:96px;left:50%;transform:translateX(-50%);max-width:70%;text-align:center;background:rgba(14,16,38,.6);padding:3px 12px;border-radius:12px;pointer-events:none;z-index:3;font-size:12px;color:#f0edff}
#log:empty,body.exp #log{display:none}
#hand{display:flex;gap:6px;padding:12px 8px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.card{-webkit-appearance:none;appearance:none;position:relative;flex:0 0 94px;border:2px solid #4a4290;border-radius:10px;padding:5px 6px;text-align:left;cursor:pointer;background:linear-gradient(165deg,#2b2152,#15112f);color:#f3efff;box-shadow:inset 0 0 12px rgba(255,255,255,.06),0 3px 0 rgba(0,0,0,.4)}
#hand .card{flex-shrink:1;min-width:76px}
.card:disabled{opacity:.4;cursor:not-allowed}
.card h3{margin:0;font:800 13px Fraunces,Georgia,serif}.card small{display:block;color:#b9b3e6;font-size:10px;line-height:1.2}
.card small em{display:block;color:#ffd27a;font-style:normal;font-weight:700}
.card .c{position:absolute;right:4px;top:3px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#c98a1a);color:#2a1a05;font:800 12px/20px system-ui;text-align:center}
.card .k{display:none;position:absolute;left:5px;top:3px;font:700 10px system-ui;color:#8f86d9}
.card .ty{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font:800 9px/1.3 system-ui;letter-spacing:.08em;padding:1px 7px;border-radius:8px;white-space:nowrap;pointer-events:none}
.card.atk{border-radius:4px;background:radial-gradient(circle at 50% 28%,rgba(255,120,70,.22),transparent 62%),linear-gradient(165deg,#3a1820,#170a10)}
.card.atk .ty{background:linear-gradient(#ff7a4a,#c8341a);color:#fff;border:1px solid #ffd0b0}.card.atk h3{color:#ffe0d0}
.card.sum{border-radius:26px 26px 8px 8px;border-style:dashed;background:radial-gradient(circle at 50% 30%,rgba(90,216,200,.3),transparent 62%),linear-gradient(165deg,#12323a,#0a1820)}
.card.sum .ty{background:linear-gradient(#6ae8d4,#2a8aa8);color:#04222a;border:1px solid #d8fff6}.card.sum h3{color:#b8fff0}
.card.sum .k{left:10px;top:9px}.card.sum .c{right:8px;top:7px}
.card.sup{border-radius:16px;background:radial-gradient(circle at 50% 28%,rgba(140,255,170,.22),transparent 62%),linear-gradient(165deg,#173a24,#0a1a10)}
.card.sup .ty{background:linear-gradient(#9affb0,#2a9a5a);color:#04220e;border:1px solid #e0ffe8}.card.sup h3{color:#d0ffdc}
.art{display:block;width:34px;height:34px;margin:-1px auto 1px}
.bot{display:flex;align-items:center;justify-content:space-between;padding:3px 10px 6px;gap:10px;color:#f0edff}
#en{font-weight:600;font-size:13px}.pips{color:#ffd34d;letter-spacing:3px;font-size:15px}
#acts{display:flex;gap:6px}
.pb{-webkit-appearance:none;min-height:36px;border:0;border-radius:9px;background:var(--en);color:#fff;font:600 14px system-ui;padding:6px 14px;cursor:pointer}.pb:disabled{opacity:.4}
#end{background:linear-gradient(#e6b84a,#b8841a);color:#2a1a05;font-weight:800;border:1px solid #6a4a10}
#flee{background:linear-gradient(#5a2a2a,#2a1010);color:#ffd0c0;border:1px solid #b5483a}
#spd{background:#2a2450;border:1px solid #6a5ac8;padding:6px 10px}
#over,#panel,#cls{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(10,8,28,.74);z-index:6;padding:16px;color:#fff;text-align:center}
#chars{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,28,.92);z-index:8;padding:16px}
.pbox{color:#f0edff;border:1px solid var(--gd);background:linear-gradient(#2a2016,#17110c);box-shadow:0 0 0 2px #1a1208,0 10px 30px rgba(0,0,0,.5);border-radius:14px;padding:16px;width:min(520px,100%);max-height:100%;overflow:auto;text-align:left;box-sizing:border-box}
.pbox h2{margin:0 0 8px;font:800 18px Fraunces,Georgia,serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}.row small{display:block;color:#b9b3e6;font-size:12px}
